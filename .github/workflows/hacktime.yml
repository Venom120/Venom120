name: Update Hackatime Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch:     # Allows manual trigger from Actions tab

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Required to commit changes back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Python Script
        env:
          HACKATIME_API_KEY: ${{ secrets.HACKATIME_API_KEY }}
          HACKATIME_API_URL: ${{ secrets.HACKATIME_API_URL }} # Optional if using custom self-hosted Hackatime endpoint
        run: python update_stats.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Update Hackatime Stats automatically"
          branch: main
          file_pattern: README.md